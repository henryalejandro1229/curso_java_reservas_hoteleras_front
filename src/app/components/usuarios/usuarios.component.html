<section class="usuarios-page" aria-labelledby="usuarios-title">
  <mat-card class="usuarios-card">
    <header class="usuarios-header">
      <div>
        <h1 id="usuarios-title">Usuarios</h1>
        <p>Administra las cuentas con acceso al sistema.</p>
      </div>

      <button mat-flat-button color="primary" type="button" (click)="agregarUsuario()">
        <mat-icon aria-hidden="true">add</mat-icon>
        Agregar usuario
      </button>
    </header>

    <div class="tabla-wrapper">
      <mat-progress-bar
        *ngIf="cargando"
        class="tabla-loader"
        mode="indeterminate"
        aria-label="Cargando usuarios">
      </mat-progress-bar>

      <table
        mat-table
        [dataSource]="dataSource"
        [attr.aria-busy]="cargando"
        class="mat-elevation-z2 usuarios-table">
        <caption class="solo-lectores">
          Usuarios del sistema y sus roles asignados.
        </caption>

        <ng-container matColumnDef="no">
          <th mat-header-cell *matHeaderCellDef scope="col">No.</th>
          <td mat-cell *matCellDef="let user; let i = index">{{ i + 1 }}</td>
        </ng-container>

        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef scope="col">Usuario</th>
          <td mat-cell *matCellDef="let user">{{ user.username }}</td>
        </ng-container>

        <ng-container matColumnDef="roles">
          <th mat-header-cell *matHeaderCellDef scope="col">Roles</th>
          <td mat-cell *matCellDef="let user">
            <mat-chip-set>
              <mat-chip *ngFor="let role of user.roles" color="primary" selected>{{ getRoleName(role) }}</mat-chip>
            </mat-chip-set>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones" stickyEnd>
          <th mat-header-cell *matHeaderCellDef scope="col">Acciones</th>
          <td mat-cell *matCellDef="let user">
            <button
              mat-icon-button
              color="primary"
              class="accion-editar"
              aria-label="Editar usuario"
              matTooltip="Editar usuario"
              (click)="editarUsuario(user)"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              class="accion-eliminar"
              aria-label="Eliminar usuario"
              matTooltip="Eliminar usuario"
              (click)="eliminarUsuario(user.username)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row fila-vacia" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            No hay usuarios registrados.
          </td>
        </tr>
      </table>
    </div>
  </mat-card>
</section>
