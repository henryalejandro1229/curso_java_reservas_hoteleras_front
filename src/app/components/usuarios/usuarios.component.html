<div class="usuarios-page">
  <mat-card class="usuarios-card">
    <div class="usuarios-header">
      <div>
        <h2>Usuarios</h2>
        <button mat-flat-button color="primary" (click)="agregarUsuario()">
          <mat-icon>add</mat-icon>
          Agregar Usuario
        </button>
      </div>
    </div>

    <div class="tabla-wrapper">
      <mat-progress-bar
        *ngIf="cargando"
        class="tabla-loader"
        mode="indeterminate"
        aria-label="Cargando usuarios">
      </mat-progress-bar>

      <table
        mat-table
        [dataSource]="dataSource"
        [attr.aria-busy]="cargando"
        class="mat-elevation-z2 usuarios-table">

        <ng-container matColumnDef="no">
          <th mat-header-cell *matHeaderCellDef>No.</th>
          <td mat-cell *matCellDef="let user; let i = index">{{ i + 1 }}</td>
        </ng-container>

        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef>Usuario</th>
          <td mat-cell *matCellDef="let user">{{ user.username }}</td>
        </ng-container>

        <ng-container matColumnDef="roles">
          <th mat-header-cell *matHeaderCellDef>Roles</th>
          <td mat-cell *matCellDef="let user">
            <mat-chip-set>
              <mat-chip *ngFor="let role of user.roles" color="primary" selected>{{ getRoleName(role) }}</mat-chip>
            </mat-chip-set>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let user">
            <button mat-icon-button color="primary" (click)="editarUsuario(user)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="eliminarUsuario(user.username)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </mat-card>
</div>
